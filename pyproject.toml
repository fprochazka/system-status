[project]
name = "system-status"
version = "0.1.0"
description = "Linux system monitor with graphs of CPU, memory, temperatures, fans, disks and GPUs, laid out by a config file"
authors = [{ name = "Filip Procházka" }]
requires-python = ">=3.12,<4"
readme = "README.md"
license = "MIT"
keywords = ["system-monitor", "hwmon", "sensors", "temperature", "fan", "gpu", "linux", "qt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Hardware",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "nvidia-ml-py>=13.615.71,<14",
    "psutil>=7.2.2,<8",
    # Stay on 6.11 like hydraping: PySide6 6.12.0 mishandles the reference count of None.
    "pyside6-essentials>=6.11.3,<6.12",
    "typer>=0.28.0,<0.29",
]

[project.urls]
Homepage = "https://github.com/fprochazka/system-status"
Repository = "https://github.com/fprochazka/system-status"

[project.scripts]
system-status = "system_status.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "ruff>=0.17.4,<0.18",
]

[tool.uv]

[tool.uv.build-backend]
module-name = ["system_status"]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
